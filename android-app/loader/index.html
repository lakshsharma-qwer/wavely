<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wavely</title>
    <style>
      html, body { height: 100%; margin: 0; background: #17110E; color: #F3E9DF; font-family: system-ui, sans-serif; }
      body { display: grid; place-items: center; }
      .wrap { text-align: center; }
      .bars { display: flex; gap: 6px; justify-content: center; height: 40px; align-items: flex-end; }
      .bars span { width: 6px; background: #FFB547; border-radius: 3px; animation: pulse 1s ease-in-out infinite; }
      .bars span:nth-child(2) { animation-delay: .15s } .bars span:nth-child(3) { animation-delay: .3s } .bars span:nth-child(4) { animation-delay: .45s }
      @keyframes pulse { 0%, 100% { height: 10px } 50% { height: 40px } }
      p { margin-top: 18px; opacity: .7; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bars"><span></span><span></span><span></span><span></span></div>
      <p id="msg">Starting Wavely…</p>
    </div>
    <script>
      // The embedded Node server takes a moment to boot; open the app once it answers.
      const origin = "http://127.0.0.1:4000";
      const started = Date.now();
      async function poll() {
        try {
          await fetch(origin + "/api/health", { mode: "no-cors", cache: "no-store" });
          location.replace(origin + "/");
        } catch {
          if (Date.now() - started > 20000) document.getElementById("msg").textContent = "Still starting… this can take a little longer the first time.";
          setTimeout(poll, 300);
        }
      }
      poll();
    </script>
  </body>
</html>
