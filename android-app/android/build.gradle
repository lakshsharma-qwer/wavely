// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// capacitor-nodejs links its JNI library with 4 KB page alignment, which phones using 16 KB
// memory pages refuse to load (the app crashes as Node starts). Link it 16 KB-compatible.
subprojects {
    afterEvaluate {
        if (project.name == "capacitor-nodejs") {
            android.defaultConfig.externalNativeBuild.cmake.arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
